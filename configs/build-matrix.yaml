version: 1
board: easepi-r2
architecture: arm64

image_types:
  armbian: [minimal, server, desktop]
  debian: [minimal, server, desktop]
  ubuntu: [minimal, server, desktop]
  alpine: [minimal, server]
  fedora: [minimal, server]
  archlinuxarm: [minimal, server]
  kali: [minimal, server]
  openwrt: [squashfs, ext4]
  reserved: []

kernel_aliases:
  "6.1": vendor
  "6.18": current
  "7.0": linux7

status:
  implemented: "Build adapter exists, is routed by build-image.sh, and is listed in README."
  designed: "Command contract is documented and routed, but the adapter exits TODO."
  reserved: "Matrix target is planned, but the adapter is not implemented yet."

targets:
  - system: armbian
    release: bookworm
    note: Debian 12
    primary_kernel: "6.1"
    secondary_kernel: "6.18"
    kernels:
      "6.1": implemented
      "6.18": implemented

  - system: armbian
    release: trixie
    note: Debian 13
    primary_kernel: "6.18"
    secondary_kernel: "7.0"
    kernels:
      "6.18": implemented
      "7.0": implemented

  - system: armbian
    release: forky
    note: Debian 14 preview
    primary_kernel: "7.0"
    secondary_kernel: null
    kernels:
      "7.0": implemented

  - system: armbian
    release: jammy
    note: Ubuntu 22.04 LTS
    primary_kernel: "6.1"
    secondary_kernel: "6.18"
    kernels:
      "6.1": implemented
      "6.18": implemented

  - system: armbian
    release: noble
    note: Ubuntu 24.04 LTS
    primary_kernel: "6.18"
    secondary_kernel: "7.0"
    kernels:
      "6.18": implemented
      "7.0": implemented

  - system: armbian
    release: resolute
    note: Ubuntu 26.04 LTS preview
    primary_kernel: "7.0"
    secondary_kernel: null
    kernels:
      "7.0": implemented

